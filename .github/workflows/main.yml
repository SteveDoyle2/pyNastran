name: CI

on:
  push:
    paths-ignore:
      - '*.md'
      - '*.rst'
  pull_request:
    branches: [main]
  schedule:
    # At the end of every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Python ${{ matrix.python-version }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: '3.11', mode: latest, extras: 'nogui,dev,ci'}
          - {python-version: '3.12', mode: latest, extras: 'nogui,dev,ci'}
          - {python-version: '3.13', mode: latest, extras: 'nogui,dev,ci'}
          - {python-version: '3.14', mode: latest, extras: 'nogui,dev,ci'}
          - {python-version: '3.15', mode: latest, extras: 'nogui,dev,ci'}
          - {python-version: '3.11', mode: basic, extras: ci}
          - {python-version: '3.13', mode: basic, extras: ci}
          - {python-version: '3.15', mode: basic, extras: ci}
          - {python-version: '3.11', mode: no_scipy}
          - {python-version: '3.15', mode: no_scipy}
          - {python-version: '3.11', mode: gui, extras: 'gui_pyqt5,dev,ci', qt-api: pyqt5}
          - {python-version: '3.11', mode: gui, extras: 'gui_pyqt6,dev,ci', qt-api: pyqt6}
          - {python-version: '3.11', mode: gui, extras: 'gui_pyside6,dev,ci', qt-api: pyside6}
          - {python-version: '3.12', mode: gui, extras: 'gui_pyqt6,dev,ci', qt-api: pyqt6}
          - {python-version: '3.12', mode: gui, extras: 'gui_pyside6,dev,ci', qt-api: pyside6}
          - {python-version: '3.13', mode: gui, extras: 'gui_pyqt6,dev,ci', qt-api: pyqt6}
          - {python-version: '3.13', mode: gui, extras: 'gui_pyside6,dev,ci', qt-api: pyside6}
          - {python-version: '3.14', mode: gui, extras: 'gui_pyqt6,dev,ci', qt-api: pyqt6}
          - {python-version: '3.14', mode: gui, extras: 'gui_pyside6,dev,ci', qt-api: pyside6}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install configuration
        if: matrix.mode != 'no_scipy'
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          python -m pip install -e ".[${EXTRAS}]"
          python -m pip check

      - name: Install minimal no-SciPy configuration
        if: matrix.mode == 'no_scipy'
        run: |
          python -m pip install --group no-scipy
          python -m pip install -e . --no-deps
          python -c "import importlib.util; assert importlib.util.find_spec('scipy') is None"

      - name: Install GUI system libraries
        if: matrix.mode == 'gui'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libx11-xcb1 libxrender1 libxi6 libxkbcommon-x11-0

      - name: List dependencies
        run: python -m pip list

      - name: Run no-SciPy tests
        if: matrix.mode == 'no_scipy'
        run: coverage run pyNastran/all_tests_no_scipy.py

      - name: Run non-GUI tests
        if: matrix.mode == 'latest' || matrix.mode == 'basic'
        run: coverage run pyNastran/all_tests_no_gui.py

      - name: Run GUI and non-GUI tests
        if: matrix.mode == 'gui'
        env:
          QT_API: ${{ matrix.qt-api }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          QT_QPA_PLATFORM: xcb
        # xcb needs a running X server, even with software OpenGL rendering.
        run: xvfb-run --auto-servernum coverage run pyNastran/all_tests.py

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
