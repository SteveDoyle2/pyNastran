# This is a basic workflow to help you get started with Actions
#
# things to fixa at some point
# - add in latest_pyside_gui
# - latest_pyqt_gui for python 3.9 (currently vtk is not on PyPi)
#   - currently a duplicate build is running
name: CI

#--------------------------------------------------------------------------------------------
# ┌────────── minute (0 - 59)
# │ ┌────────── hour (0 - 23)
# │ │ ┌────────── day of the month (1 - 31)
# │ │ │ ┌────────── month (1 - 12)
# │ │ │ │ ┌────────── day of the week (0 - 6)
# │ │ │ │ │
# │ │ │ │ │
# │ │ │ │ │
# * * * * *
# this is a 15 minute schedule
#  schedule:
#   - cron: '*/15 * * * *'
#on:
#  push:
#  pull_request:
#  schedule:
#    - cron: '*/15 * * * *'

# Controls when the action will run.
#on: [push]
on:
  push:
    paths-ignore:
      #- ".github/**"
      - "*.md"
      - "*.rst"
#    branches:
#      - main
  pull_request:
    branches: [ main ]
  schedule:
    # At the end of every day
    - cron: '0 0 * * *'

#on:
  # Triggers the workflow on push or pull request events but only for the main branch
  #push:
  #  branches: [ main ]
  #pull_request:
  #  branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  #workflow_dispatch:

#--------------------------------------------------------------------------------------------
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      matrix:
         # '3.14', '3.15-dev'
         python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
         os: [ubuntu-latest]
         # , macos-latest, windows-latest
         mode: ['latest', 'latest_basic', 'old', 'no_scipy', 'latest_pyqt5_gui','latest_pyside2_gui', 'latest_pyqt6_gui','latest_pyside6_gui',]
         # 'old_basic', 'old_pyside2_gui', 'old_pyqt5_gui',

         experimental: [false]
         #include:
         # - python: '3.11-dev'
         #   experimental: true
         #include:
         #- node: 13
         #  os: ubuntu-18.04
         #  experimental: true
         exclude:
          # remove most versions to limit jobs

          #---------------------------------------------------------
          # never tested...
          - {python-version: '3.11', mode: 'old'}
          - {python-version: '3.12', mode: 'old'}
          - {python-version: '3.13', mode: 'old'}
          - {python-version: '3.14', mode: 'old'}
          - {python-version: '3.15', mode: 'old'}

          #---------------------------------------------------------
          # only test this twice; min/max version
          - {python-version: '3.11', mode: 'no_scipy'}
          #- {python-version: '3.12', mode: 'no_scipy'}
          #- {python-version: '3.13', mode: 'no_scipy'}
          #- {python-version: '3.14', mode: 'no_scipy'}
          - {python-version: '3.15', mode: 'no_scipy'}

          #---------------------------------------------------------
          # cut testing in the middle?
          #   keep 3.13 because there is no gui testing for it
          #
          # keep all testing b/c gui testing fails a lot
          #
          #- {python-version: '3.11', mode: 'latest'}
          #- {python-version: '3.12', mode: 'latest'}
          #- {python-version: '3.13', mode: 'latest'}
          #- {python-version: '3.14', mode: 'latest'}
          #- {python-version: '3.15', mode: 'latest'}

          #---------------------------------------------------------
          # remove most versions to limit jobs

          # all for now; lowest version
          # old pyqt/pyside only
          #- {python-version: '3.11', mode: 'latest_pyqt5_gui'}
          #- {python-version: '3.11', mode: 'latest_pyqt6_gui'}   # doen't exist?
          #- {python-version: '3.11', mode: 'latest_pyside2_gui'}
          #- {python-version: '3.11', mode: 'latest_pyside6_gui'}   # doen't exist?

          # first v6 testing
          - {python-version: '3.12', mode: 'latest_pyqt5_gui'}
          #- {python-version: '3.12', mode: 'latest_pyqt6_gui'}
          - {python-version: '3.12', mode: 'latest_pyside2_gui'}
          #- {python-version: '3.12', mode: 'latest_pyside6_gui'}

          # skipping because all is next
          # pyside only...later
          - {python-version: '3.13', mode: 'latest_pyqt5_gui'}
          - {python-version: '3.13', mode: 'latest_pyqt6_gui'}
          #- {python-version: '3.13', mode: 'latest_pyside2_gui'}  # last version?
          - {python-version: '3.13', mode: 'latest_pyside6_gui'}

          # latest gui - all
          # pyqt only...later
          #- {python-version: '3.14', mode: 'latest_pyqt5_gui'}
          #- {python-version: '3.14', mode: 'latest_pyqt6_gui'}
          - {python-version: '3.14', mode: 'latest_pyside2_gui'}   # doesn't exist
          #- {python-version: '3.14', mode: 'latest_pyside6_gui'}

          # gui not supported
          - {python-version: '3.15', mode: 'latest_pyqt5_gui'}
          - {python-version: '3.15', mode: 'latest_pyqt6_gui'}
          - {python-version: '3.15', mode: 'latest_pyside2_gui'}
          - {python-version: '3.15', mode: 'latest_pyside6_gui'}
          #- {python-version: '3.15-dev', mode: 'old'}
      fail-fast: false
     #- continue-on-error: ${{ matrix.experimental }}
#strategy:
    #  matrix:
          #https://github.com/zopyx/xmldirector.connector/blob/master/.travis.yml#L15-L54
          #python-version: [3.7, 3.8]
          #env:
          # - {COVERAGE_RUN='coverage run'  CODECOV='codecov'  NUMPY='numpy scipy matplotlib h5py vtk pyqt5 pandas>=0.25 imageio pillow>5.2,!=7.1.0'  LIB='libblas-dev liblapack-dev'}

          #python-version: 3.8
          #env:
          # COVERAGE_RUN='coverage run'
          # CODECOV='codecov'
          # NUMPY='numpy scipy matplotlib h5py vtk pyqt5 'pandas>=1.0' imageio pillow>5.2,!=7.1.0'
          # LIB='libblas-dev liblapack-dev'

    #--------------------------------------------------------------------------------------------------
    # latest versions of package
    #- name: "Python  ${{ matrix.python-version }} (PyQt5)"
      #python-version: [3.7, 3.8, 3.9]
      #env:
      #- COVERAGE_RUN='coverage run'
      #- CODECOV='codecov'
      #- NUMPY='numpy scipy matplotlib h5py vtk pyqt5 'pandas>=1.0' imageio pillow>5.2,!=7.1.0'
      ##- LIB='libblas-dev liblapack-dev'
      #- LIBH5='libhdf5-dev'
    #--------------------------------------------------------------------------------------------------
    # oldest versions of package
    #--------------------------------------------------------------------------------------------------
    # Steps represent a sequence of tasks that will be executed as part of the job
    #env: ${{ matrix.env }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      #- uses: actions/checkout@v3  # works
      #
      # version per google claude on 2026/10
      - uses: actions/checkout@v7   # testing

      - name: Print environment variables exposed by GitHub
        run: |
          echo "GITHUB_ACTOR=$GITHUB_ACTOR"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_HEAD_REF=$GITHUB_HEAD_REF"
          echo "GITHUB_BASE_REF=$GITHUB_BASE_REF"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          echo "GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_ACTION=$GITHUB_ACTION"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies - ${{ matrix.mode }}
        run: |
         python -m pip install --upgrade pip
         pip install flake8 coverage
         #if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
         pip list

        #mode: ['latest', 'latest_basic',
        #       'latest_pyside2_gui', 'latest_pyside6_gui',
        #       'latest_pyqt5_gui', 'latest_pyqt6_gui',
        #       'old', 'old_basic',
        #       'old_pyside_gui', 'old_pyqt_gui']
        #
      - if: ${{ matrix.mode == 'latest_basic'       || matrix.mode == 'latest' ||
                matrix.mode == 'latest_pyside2_gui' || matrix.mode == 'latest_pyside6_gui' ||
                matrix.mode == 'latest_pyqt5_gui'   || matrix.mode == 'latest_pyqt6_gui' }}
        name: Install latest basic packages
        run: |
          pip install numpy scipy
        #--no-binary  :all:

      - if: ${{ matrix.mode == 'latest' ||
                matrix.mode == 'latest_pyside2_gui' || matrix.mode == 'latest_pyside6_gui' ||
                matrix.mode == 'latest_pyqt5_gui'   || matrix.mode == 'latest_pyqt6_gui' }}
        name: Install latest packages (pandas, matplotlib)
        run: |
          pip install pandas matplotlib

      - if: ${{  matrix.python-version != '3.15' && (matrix.mode == 'latest' ||
                 matrix.mode == 'latest_pyside2_gui' || matrix.mode == 'latest_pyside6_gui' ||
                 matrix.mode == 'latest_pyqt5_gui'   || matrix.mode == 'latest_pyqt6_gui') }}
        name: Install latest packages (h5py)
        run: |
          pip install h5py tables

      - if: ${{ matrix.python-version != '3.15' && (
                matrix.mode == 'latest_pyside2_gui' || matrix.mode == 'latest_pyside6_gui' ||
                matrix.mode == 'latest_pyqt5_gui'   || matrix.mode == 'latest_pyqt6_gui') }}
        name: Install latest packages (imageio, pillow)
        #if: ${{ (
        #if: ${{ (matrix.mode == 'latest_pyside2_gui' || matrix.mode == 'latest_pyside6_gui' ||
        #         matrix.mode == 'latest_pyqt5_gui'   || matrix.mode == 'latest_pyqt6_gui') }}
        run: |
          pip install imageio pillow>=10.1.0

      - if: ${{ matrix.python-version != '3.15' && (
               matrix.mode == 'latest_pyside2_gui' || matrix.mode == 'latest_pyside6_gui' ||
               matrix.mode == 'latest_pyqt5_gui'   || matrix.mode == 'latest_pyqt6_gui') }}
        name: Install latest packages (vtk)
        #if: ${{ (matrix.mode == 'latest_pyside2_gui' || matrix.mode == 'latest_pyside6_gui' ||
        #         matrix.mode == 'latest_pyqt5_gui'   || matrix.mode == 'latest_pyqt6_gui') }}
        run: |
          pip install vtk qtpy

      - if: ${{ matrix.mode == 'latest_pyside2_gui' && matrix.python-version != '3.15' }}
        name: Install PySide2
        run: |
          sudo apt-get install -y xvfb libegl1 libgl1 libxcb-cursor0
          pip install PySide2

      - if: ${{ matrix.mode == 'latest_pyside6_gui' && matrix.python-version != '3.15' }}
        name: Install PySide6
        run: |
          pip install PySide6

        #sudo apt-get install -y xvfb libegl1 libgl1 libxcb-cursor0
      - if: ${{ matrix.mode == 'latest_pyqt5_gui' && matrix.python-version != '3.15' }}
        name: Install PyQt5
        run: |
          pip install PyQt5

      - if: ${{ matrix.mode == 'latest_pyqt6_gui' && matrix.python-version != '3.15' }}
        name: Install PyQt6
        run: |
          pip install PyQt6

#-----------------------------------------------------------------------------------
# old
      # pandas==1.1.3
      #- name: Install old packages (3.9)
      #  if: ${{ matrix.mode == 'old' && matrix.python-version == '3.9' }}
      #  run: |
      #    pip install numpy==1.19.4 scipy==1.5.4 matplotlib==3.3.3 h5py==3.0.0 pandas==1.1.3 #--no-binary :all:
#-----------------------------------------------------------------------------------

        # I'd like to make this step build a wheel and install it, but you need the wheel name
        # or know how to use bash to pipe an ls into a pip command, so I can do:
        # >>> python setup.py bdist_wheel
        # >>> pip install dist/pyNastran*.whl   <--- the * is a problem
        #
        # python 3.9 gets everything
        # any python 3.8 test that can't be run in the previous block
      - if: ${{ matrix.mode != 'no_scipy' }}
        name: Install dependencies (pip)
         #pip install dist/pyNastran*.whl
         #python setup.py bdist_wheel
        #if: ${{  (matrix.python-version == '3.9') || (matrix.python-version == '3.10') }}
        run: |
          pip install -e .

      - if: ${{ matrix.mode == 'no_scipy' }}
        name: Remove Scipy
        run: |
          pip list
          pip install -e . --no-deps
          pip install numpy
          pip install cpylog
 
      - name: List dependencies
        run: |
          pip list

      - if: ${{ matrix.mode == 'no_scipy' }}
        name: Run No Scipy
        run: |
         coverage run pyNastran/all_tests_no_scipy.py

      - if: ${{ (matrix.mode == 'latest' || matrix.mode == 'latest_basic' || matrix.mode == 'old') }}
        #if: ${{ matrix.python-version == '3.12' || (
        #          matrix.mode == 'latest' || matrix.mode == 'latest_basic' || matrix.mode == 'old') }}
        #if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        name: Run No GUI 3.12
        #run: |
        # python pyNastran/all_tests_no_gui.py
        # coverage run pyNastran/all_tests_no_gui.py
        run: |
         coverage run pyNastran/all_tests_no_gui.py

        # 3.11 - No matching distribution found for vtk
      - if: ${{ (matrix.mode == 'latest_pyside2_gui' || matrix.mode == 'latest_pyside6_gui' ||
                 matrix.mode == 'latest_pyqt5_gui'  || matrix.mode == 'latest_pyqt6_gui') }}
        name: Run GUI
        #env:
        #  # run headless
        #  # don't use this with xvfb
        #  QT_QPA_PLATFORM: offscreen
        env:
          # used with xvfb
          # Force software rendering for VTK/OpenGL (instead of GPU)
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"

          # Explicitly block any accidental Wayland bypass
          QT_QPA_PLATFORM: "xcb"

        #if: ${{ matrix.python-version != '3.12' && (
        #         matrix.mode == 'latest_pyside2_gui' || matrix.mode == 'latest_pyside6_gui' ||
        #         matrix.mode == 'latest_pyqt5_gui'  || matrix.mode == 'latest_pyqt6_gui') }}
        #if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

        # includes all tests, but core dumps on CI
        # is that due to taking too long?
        #run: |
        # python pyNastran/all_tests.py
        # coverage run pyNastran/all_tests.py

        # double runs
        # gui only - xvfb only on first run
        #run: |
        # xvfb-run python pyNastran/all_tests_gui.py
        # coverage run pyNastran/all_tests_gui.py
        #
        # xvfb-run: fakes a display
        #   --auto-servernum: makes xvfb find the right display port

        # core dump
        #run: |
        # xvfb-run --auto-servernum coverage run pyNastran/all_tests_gui.py

        # core dump
        #run: |
        # xvfb-run --auto-servernum python pyNastran/all_tests_gui.py

        # latest AI hallucination
        # env:   COVERAGE_CORE: sys
        #run: |
        #  xvfb-run --server-args="-screen 0 1024x768x24" python pyNastran/all_tests_gui.py

        # identified vtk core dump issue
        #run: |
        #  sudo apt-get update && sudo apt-get install -y gdb
        #  xvfb-run --server-args="-screen 0 1024x768x24" gdb -ex "run" -ex "bt" -ex "quit" --args python pyNastran/all_tests_gui.py

        # final version
        run: |
         coverage run pyNastran/all_tests_gui.py

      #- name: Upload coverage
      #  run: |
      #   codecov
      #
      # version per https://github.com/codecov/codecov-action on 2026/10
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        env:
         CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

